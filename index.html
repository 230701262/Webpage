<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, welcoming webpage.">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 640px);
      padding: clamp(32px, 8vw, 64px);
      text-align: center;
      background: #fff;
      border: 1px solid #e7eaf1;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgb(28 43 72 / 10%);
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 7px 12px;
      color: #4f46e5;
      background: #eef2ff;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 650;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      letter-spacing: -0.06em;
      line-height: 1.08;
    }

    p {
      max-width: 430px;
      margin: 18px auto 28px;
      color: #667085;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      color: #fff;
      background: #4f46e5;
      border-radius: 12px;
      font-weight: 650;
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }

    a:hover {
      background: #4338ca;
      transform: translateY(-2px);
    }

    a:focus-visible {
      outline: 3px solid #a5b4fc;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
</body>
</html>
